name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本，例如 0.1.6'
        required: true
        default: '0.1.6'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max-old-space-size=4096'
  WAILS_VERSION: 'v2.12.0'

jobs:
  validate:
    name: 验证版本与测试
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算发布版本
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号必须使用 x.y.z 格式，当前为: $version" >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Linux Wails 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 同步版本号
        shell: bash
        run: node scripts/sync-version.mjs "$VERSION"

      - name: 验证版本同步脚本
        shell: bash
        run: |
          node --test scripts/sync-version.test.mjs
          node scripts/sync-version.mjs --check

      - name: 校验项目版本
        shell: bash
        run: |
          set -euo pipefail
          VERSION_FROM_WAILS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('wails.json','utf8')).info.productVersion)")
          if [ "$VERSION_FROM_WAILS" != "$VERSION" ]; then
            echo "wails.json 的 productVersion 是 $VERSION_FROM_WAILS，与发布版本 $VERSION 不一致" >&2
            exit 1
          fi

      - name: 准备临时前端资源目录
        shell: bash
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>ZenTerm</title>' > frontend/dist/index.html

      - name: 生成 Wails 绑定
        shell: bash
        run: wails build -s -skipembedcreate -nopackage -ldflags "-X zenterm/cmd.appVersion=${VERSION}"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 生产依赖审计
        working-directory: frontend
        run: npm audit --omit=dev

      - name: 前端生产构建
        working-directory: frontend
        run: npm run build

      - name: 前端类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 前端 lint
        working-directory: frontend
        run: npm run lint

      - name: 前端测试
        working-directory: frontend
        run: npm test

      - name: Go 测试
        run: go test . ./cmd ./internal/...

      - name: Go 竞态检测
        run: go test -race ./cmd ./internal/db ./internal/security ./internal/service ./internal/syncer ./internal/updater

      - name: Go 静态检查
        run: go vet ./...

  build:
    name: 构建 ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux/amd64
            slug: linux-amd64
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            slug: windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算发布版本
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 同步版本号
        shell: bash
        run: node scripts/sync-version.mjs "$VERSION"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 准备临时前端资源目录
        shell: bash
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>ZenTerm</title>' > frontend/dist/index.html

      - name: 安装 Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 构建 Wails 应用
        shell: bash
        run: wails build -platform ${{ matrix.platform }} -ldflags "-X zenterm/cmd.appVersion=${VERSION}"

      - name: 签名 Windows 可执行文件
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host "未配置 Windows 签名证书，跳过 Authenticode 签名。"
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "已配置 WINDOWS_CERTIFICATE_BASE64，但缺少 WINDOWS_CERTIFICATE_PASSWORD。"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "zenterm-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          try {
            $signature = Set-AuthenticodeSignature `
              -FilePath "build/bin/ZenTerm.exe" `
              -Certificate $certificate `
              -HashAlgorithm SHA256 `
              -TimestampServer "http://timestamp.digicert.com"
            if ($signature.Status -ne "Valid") {
              throw "Authenticode 签名验证失败: $($signature.Status) $($signature.StatusMessage)"
            }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }

      - name: 打包 Linux 产物
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          asset="ZenTerm-${VERSION}-${{ matrix.slug }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/$asset" -C build/bin ZenTerm
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - name: 打包 Windows 产物
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "ZenTerm-$env:VERSION-${{ matrix.slug }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/bin/ZenTerm.exe" -DestinationPath "dist/$asset" -Force
          $hash = Get-FileHash "dist/$asset" -Algorithm SHA256
          "$($hash.Hash.ToLower())  $asset" | Out-File -FilePath "dist/$asset.sha256" -Encoding ascii

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zenterm-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: 构建 macOS
    needs: validate
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算发布版本
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 同步版本号
        shell: bash
        run: node scripts/sync-version.mjs "$VERSION"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 准备临时前端资源目录
        shell: bash
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>ZenTerm</title>' > frontend/dist/index.html

      - name: 安装 Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 配置 macOS 签名钥匙串
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE_BASE64}" ]; then
            echo "未配置 Apple 签名证书，跳过 Developer ID 签名和 notarization。"
            exit 0
          fi
          if [ -z "${APPLE_CERTIFICATE_PASSWORD}" ] || [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
            echo "已配置 APPLE_CERTIFICATE_BASE64，但证书密码或签名身份缺失。" >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/zenterm-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/zenterm-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: 创建 macOS 打包脚本
        shell: bash
        run: |
          cat > /tmp/build-macos.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          platform="$1"
          slug="$2"
          asset="ZenTerm-${VERSION}-${slug}.zip"

          rm -rf build/bin
          wails build -clean -platform "$platform" -ldflags "-X zenterm/cmd.appVersion=${VERSION}"

          mkdir -p dist
          if [ -d build/bin/ZenTerm.app ]; then
            if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" build/bin/ZenTerm.app
              codesign --verify --deep --strict --verbose=2 build/bin/ZenTerm.app
            fi
            ditto -c -k --sequesterRsrc --keepParent build/bin/ZenTerm.app "dist/$asset"
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ]; then
              xcrun notarytool submit "dist/$asset" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --wait
              xcrun stapler staple build/bin/ZenTerm.app
              rm -f "dist/$asset"
              ditto -c -k --sequesterRsrc --keepParent build/bin/ZenTerm.app "dist/$asset"
            elif [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              echo "产物已签名，但 notarization 凭据不完整，跳过公证。"
            fi
          else
            if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" build/bin/ZenTerm
              codesign --verify --strict --verbose=2 build/bin/ZenTerm
            fi
            ditto -c -k --sequesterRsrc --keepParent build/bin/ZenTerm "dist/$asset"
          fi
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          BASH
          chmod +x /tmp/build-macos.sh

      - name: 构建 macOS Universal
        shell: bash
        run: /tmp/build-macos.sh darwin/universal macos-universal

      - name: 构建 macOS Intel
        continue-on-error: true
        shell: bash
        run: /tmp/build-macos.sh darwin/amd64 macos-amd64

      - name: 构建 macOS Apple Silicon
        continue-on-error: true
        shell: bash
        run: /tmp/build-macos.sh darwin/arm64 macos-arm64

      - name: 清理 macOS 签名钥匙串
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/zenterm-signing.keychain-db" 2>/dev/null || true

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zenterm-macos
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs:
      - build
      - build-macos
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算发布版本
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/ZenTerm-*

      - name: 生成 Release 说明
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ZenTerm ${VERSION}

          云端构建产物：
          EOF

          add_asset() {
            local file="$1"
            local label="$2"
            if [ -f "release-assets/$file" ]; then
              echo "- ${label}：${file}" >> release-notes.md
            fi
          }

          add_asset "ZenTerm-${VERSION}-macos-universal.zip" "macOS Universal"
          add_asset "ZenTerm-${VERSION}-macos-amd64.zip" "macOS Intel"
          add_asset "ZenTerm-${VERSION}-macos-arm64.zip" "macOS Apple Silicon"
          add_asset "ZenTerm-${VERSION}-windows-amd64.zip" "Windows x64"
          add_asset "ZenTerm-${VERSION}-linux-amd64.tar.gz" "Linux x64"

          cat >> release-notes.md <<EOF

          说明：
          - 所有产物都生成 GitHub artifact provenance，可使用 GitHub CLI 验证构建来源。
          - 配置仓库签名 secrets 后，Windows 产物使用 Authenticode，macOS 产物使用 Developer ID 并提交 notarization。
          - macOS Universal 是 macOS 主包；Intel / Apple Silicon 单独包为附加构建。
          - Linux 版本需要系统已安装 GTK3 与 WebKitGTK 运行库。
          - 每个包旁边都提供了对应的 SHA-256 校验文件。
          EOF

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "ZenTerm $VERSION" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "ZenTerm $VERSION" \
              --notes-file release-notes.md
          fi
